<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Atividade 07</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- 
    Exercício 6 — Galeria de Fotos 
Crie uma galeria com pelo menos 8 imagens (temas: viagens, animais, natureza, o que preferir).

Estilização (use Grid):

Use display: grid para organizar as imagens em um mosaico de 4 colunas.
Faça pelo menos uma das imagens ocupar o espaço de duas colunas ou duas linhas (dica: pesquise sobre a propriedade grid-column e/ou grid-row).
Todas as imagens devem ter o mesmo border-radius e um espaçamento (gap) uniforme entre elas.
    -->
</head>

<body>
    <header>Stock</header>

    <main>
        <div class="images-grid">
            <img class="biggers" src="https://cdn.autopapo.com.br/box/uploads/2024/06/24173232/honda-cb-250-r-2012-e1719261209240.png" alt="Moto Honda CBR 250R">
            <img class="biggers" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4vDF8Pfyb2m2GDVtzKqY0aXun5q4C5B4cCinceuatw76kfQlH7SzxQ1hB&s=10" alt="Moto CFMoto 675-SR-R">
            <img src="https://mobilidade.estadao.com.br/wp-content/uploads/2022/11/MVAgusta_Superveloce800-1024x660.jpg" alt="Moto MV Agusta Superveloce 800">
            <img src="https://images.caradisiac.com/logos/5/0/5/2/285052/S0-une-toute-nouvelle-yamaha-r3-pour-2025-et-des-nouveaux-coloris-pour-la-r125-211542.jpg" alt="Moto Yamaha YZR R3">

            <img src="https://garagem360.com.br/wp-content/uploads/2021/09/343017_22YM_HONDA_CBR500R.jpg" alt="Moto Honda CBR 500R">
            <img src="https://motonline.com.br/noticia/wp-content/uploads/2023/02/Kawasaki-ZX-4RR-2.jpg" alt="Moto Kawasaki-ZX-4RR-2">
            <img class="smallers" src="https://s2-autoesporte.glbimg.com/L6Zu9WjCgLB9XsG2MrXqUTAJ5yc=/0x0:4914x3276/1008x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2019/J/j/4dTiNoRiav89BUjZVVOA/p90327384-highres-bmw-s-1000-rr-11-201.jpg" alt="Moto BMW S1000 RR">
            <img class="smallers" src="https://www.webmotors.com.br/wp-content/uploads/2018/02/20152649/2-564_mundomoto_yamaha_yzf600r6_01.jpg" alt="Moto Yamaha YZR R6">

    </main>
