<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 004</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>

    <!-- 
    Exercício 4 — Página "Meus Links Favoritos"
Crie uma página estilo "linktree" (aquelas páginas de link único usadas em bio de redes sociais), com:

Uma imagem/avatar no topo;
Um nome/título;
Uma lista de pelo menos 6 links (sites, redes sociais, o que quiser), cada um abrindo em nova aba.
Estilização (use Flexbox):

Cada link deve parecer um botão, ocupando a largura do "cartão" central, um embaixo do outro.
Use display: flex com flex-direction: column para empilhar os botões com espaçamento uniforme entre eles (gap).
Cada botão deve mudar de cor de fundo no hover.
     -->
</head>

<body>
    <main>
        <div class="linktree">

            <div class="avatar">
                <div class="avatarImage">
                    <img src="https://i.redd.it/p89a7w851xwa1.png" alt="avatar">
                </div>

                <div class="apresentation">
                    <h1>Hi, I am Enderman!</h1>
                </div>

            </div>

            <div class="links">
                <a href="https://pt.minecraft.wiki/w/Enderman" target="_blank">Enderman Wiki</a>
                <a href="https://www.youtube.com/watch?v=X_XGxzMrq04" target="_blank">Favorite(s) Songs</a>
                <a href="https://www.youtube.com/watch?v=5vDetbvbHrU" target="_blank">Beach Vlog</a>
                <a href="https://www.youtube.com/watch?v=MKIRZSs0Spw" target="_blank">Beach Vlog 2</a>
                <a href="https://www.youtube.com/watch?v=Vtbw81i_D-Q" target="_blank">Snow Vlog</a>
                <a href="https://www.amazon.com.br/Legendary-Enderman-Unofficial-Minecraft-English-ebook/dp/B019UHKWP6"
                    target="_blank">Buy a Book</a>
            </div>
        </div>

    </main>
</body>

</html>
