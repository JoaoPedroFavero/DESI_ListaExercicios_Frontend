<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 003</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Exercício 3 — Card de Produto (Loja Virtual)
Crie o card de um único produto (como se fosse de um e-commerce), contendo:

Imagem do produto;
Nome, preço e uma pequena descrição;
Dois botões: "Adicionar ao carrinho" e "Comprar agora".
Estilização (use Flexbox):

Organize o conteúdo do card com display: flex (você escolhe se em coluna ou linha).
Os dois botões devem ficar lado a lado, com espaçamento entre eles, usando Flexbox.
Um botão deve ter destaque visual maior que o outro (cor mais forte, por exemplo).
Adicione efeito de hover nos botões. -->
</head>

<body>
    <main>
        <header>
            <div class="bg-barra-pesquisa">
                <input type="text" class="barra-pesquisa" placeholder="Pesquisar"></input>
            </div>
        </header>

        <div class="produto-container">

            <div class="imagem-relogio">
                <img src="https://www.sejaorion.com/cdn/shop/files/Relogio_Masculino_Octagonal_Orion12.jpg?v=1729284633&width=1445"
                    alt="Relógio Masculino Prata">
            </div>

            <div class="interation-container">
                <div>
                    <h1>Relógio SappHero Orion Prata e Preto</h1>

                    <p class="preco">R$649,90</p>

                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean tempus tempor iaculis. Maecenaseu consectetur nisl, lacinia varius justo. Aliquam ullamcorper nisl non libero tempor tempus. Quisque ultrices, nisi nec ultricies laoreet, neque mi mollis.</p>

                </div>

                <div class="buttons">
                    <button class="addToCart">Adicionar ao Carrinho</button>
                    <button class="buyNow">Comprar agora</button>
                </div>
            </div>
        </div>


    </main>
</body>

</html>
